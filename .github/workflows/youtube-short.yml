name: Publicar Short diario

on:
  schedule:
    - cron: '23 17 * * *' # todos los días a las 17:23 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: youtube-short
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: youtube-shorts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Generar y subir
        run: node publicar.js
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY || 'private' }}
      - name: Guardar progreso
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add estado.json
          git diff --cached --quiet || (git commit -m "Short publicado: avanzar a la siguiente pregunta" && git push)
