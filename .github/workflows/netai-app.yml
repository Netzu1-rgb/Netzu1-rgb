name: NetAI app

on:
  push:
    paths:
      - "netai-app/**"
      - ".github/workflows/netai-app.yml"
  pull_request:
    paths:
      - "netai-app/**"

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: netai-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: netai-app/package-lock.json
      - run: npm ci
      - name: Pruebas unitarias
        run: npm test
      - name: Navegador para las pruebas
        run: npx playwright install --with-deps chromium
      - name: Pruebas de navegador (compila la app)
        run: npm run test:e2e
