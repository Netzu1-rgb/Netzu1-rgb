.chrome.cios { background: #f2f2f7 }
.chrome.cios .url { position: relative; justify-content: flex-start; padding-right: 30px }

.var[aria-checked="true"] { border-color: #6d4be9; box-shadow: 0 0 0 3px rgba(109,75,233,.18) }
.vh { margin: 8px 0 0; font-size: 13px; color: #6b6b7a }

.m18 .u { position: absolute; left: 8px; right: 8px; bottom: 17px; height: 8px; border-radius: 4px; background: #cfd1d9 }

<title>Instalar Truevento</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: a night-sky header like the app's splash, then numbered steps, each a sentence on the left and a phone on the right (stacked on phones). */
:root {
  --night: #0b0a17; --night-2: #15132a;
  --bg: #f5f4fb; --surface: #ffffff; --surface-2: #eeedf7; --line: #dedcef;
  --ink: #17142b; --ink-soft: #4a4668; --ink-mute: #6f6b8c;
  --brand: #5b55e8; --brand-deep: #4338ca; --brand-soft: #e9e7ff;
  --violet: #7c3aed; --pink: #d6337a; --tap: #ff3d71;
  --ok: #11803f;
  --font-display: 'Outfit', ui-sans-serif, system-ui, sans-serif;
  --font-body: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b0a17; --surface: #16142b; --surface-2: #211e3d; --line: #2e2a52;
  --ink: #f2f0ff; --ink-soft: #c9c5ea; --ink-mute: #9d98c4;
  --brand: #8b85ff; --brand-deep: #b3aeff; --brand-soft: #262256; --ok: #39c27a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0b0a17; --surface: #16142b; --surface-2: #211e3d; --line: #2e2a52;
  --ink: #f2f0ff; --ink-soft: #c9c5ea; --ink-mute: #9d98c4;
  --brand: #8b85ff; --brand-deep: #b3aeff; --brand-soft: #262256; --ok: #39c27a; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 16px/1.55 var(--font-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--night) }
.wrap { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0 }

/* header */
.hero { background: radial-gradient(120% 90% at 50% 0%, #2a2470 0%, var(--night) 62%); color: #fff;
  margin-top: calc(-1 * env(safe-area-inset-top, 0px)); padding-top: calc(env(safe-area-inset-top, 0px) + 1.25rem); padding-bottom: 2.25rem; position: relative; overflow: hidden }
.hero::after { content: ""; position: absolute; inset: auto 0 0; height: 4px; background: linear-gradient(90deg, #4f5fe6, #8a3fdc, #e0457b) }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 800; letter-spacing: .08em }
.brand img { width: 40px; height: 40px; border-radius: 12px }
.brand small { display: block; font-weight: 500; font-size: 10px; letter-spacing: .4em; opacity: .7 }
.langs { display: flex; gap: 6px }
.langs button { font: 600 13px var(--font-body); color: #d9d6ff; background: transparent; border: 1px solid rgba(255,255,255,.25); border-radius: 999px; padding: 7px 12px; cursor: pointer; min-height: 36px }
.langs button[aria-pressed="true"] { background: #fff; color: var(--night); border-color: #fff }
.hero h1 { font-size: clamp(1.9rem, 5.5vw, 3.1rem); line-height: 1.08; margin-top: 1.6rem; max-width: 18ch; font-weight: 800 }
.hero p { color: #cfcbf3; max-width: 52ch; margin: .8rem 0 0; font-size: 1.05rem }
.perks { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 1.2rem; padding: 0; list-style: none }
.perks li { font-size: 13.5px; font-weight: 600; color: #fff; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.14); border-radius: 999px; padding: 6px 12px }

/* device switch */
.switch { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--surface-2); border-radius: 16px; padding: 6px; margin: 1.6rem 0 .4rem; max-width: 460px }
.switch button { display: flex; align-items: center; justify-content: center; gap: 8px; font: 700 16px var(--font-display); color: var(--ink-mute); background: transparent; border: 0; border-radius: 12px; min-height: 52px; cursor: pointer }
.switch button svg { width: 20px; height: 20px }
.switch button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 4px 14px -6px rgba(40,30,120,.35) }
.hint { color: var(--ink-mute); font-size: 14px; margin: .2rem 0 1.4rem }

/* steps */
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 18px }
.step { display: grid; grid-template-columns: minmax(0, 1fr) 270px; gap: 28px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 24px }
.step-text { min-width: 0 }
.num { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #4f5fe6, #8a3fdc); color: #fff; font: 800 18px var(--font-display) }
.step h3 { font-size: 1.35rem; margin-top: .7rem; line-height: 1.25 }
.step p { color: var(--ink-soft); margin: .5rem 0 0; max-width: 46ch }
.step .tip { margin-top: .8rem; font-size: 14px; color: var(--ink-mute); background: var(--surface-2); border-radius: 12px; padding: 10px 12px; max-width: 46ch }
.kbd { display: inline-flex; align-items: center; gap: 5px; font-weight: 700; color: var(--ink); background: var(--brand-soft); border-radius: 8px; padding: 1px 8px; white-space: nowrap }
.kbd svg { width: 15px; height: 15px }
@media (max-width: 720px) {
  .step { grid-template-columns: 1fr; padding: 20px; gap: 18px }
  .phone { margin: 0 auto }
}

/* phone mockup */
.phone { width: 250px; max-width: 100%; aspect-ratio: 250 / 520; border-radius: 40px; background: #121018; padding: 9px; box-shadow: 0 22px 50px -22px rgba(30,20,90,.6), inset 0 0 0 2px #2d2a3a; position: relative }
.screen { position: relative; width: 100%; height: 100%; border-radius: 32px; overflow: hidden; background: #000; font-family: -apple-system, 'Inter', Roboto, sans-serif }
.android .phone, .phone.android { border-radius: 30px }
.phone.android .screen { border-radius: 23px }
.sb { position: absolute; inset: 0 0 auto; height: 30px; display: flex; align-items: center; justify-content: space-between; padding: 0 22px; font-size: 11px; font-weight: 600; color: #fff; z-index: 3 }
.sb.dark { color: #111 }
.notch { position: absolute; top: 8px; left: 50%; width: 76px; height: 21px; border-radius: 12px; background: #000; transform: translateX(-50%); z-index: 4 }
.phone.android .notch { width: 10px; height: 10px; border-radius: 50%; top: 9px }
.shot { position: absolute; left: 0; right: 0; top: 30px; width: 100%; display: block }
.dim::after { content: ""; position: absolute; inset: 0; background: rgba(0,0,0,.38); z-index: 2 }

/* browser chrome */
.safari { position: absolute; inset: auto 0 0; z-index: 3; background: rgba(246,246,248,.97); padding: 8px 10px 16px; border-top: 1px solid #d8d8de }
.url { background: #e4e4ea; border-radius: 11px; height: 30px; display: flex; align-items: center; justify-content: center; font-size: 11.5px; color: #111; gap: 5px }
.url svg { width: 10px; height: 10px }
.tools { display: flex; justify-content: space-around; align-items: center; margin-top: 9px; color: #0a84ff }
.tools span { width: 26px; height: 26px; display: grid; place-items: center; position: relative }
.tools svg { width: 20px; height: 20px }
.chrome { position: absolute; inset: 30px 0 auto; z-index: 3; background: #f1f3f4; padding: 7px 8px; display: flex; align-items: center; gap: 6px; border-bottom: 1px solid #dadce0 }
.chrome .url { flex: 1; background: #e3e5e8; border-radius: 16px; justify-content: flex-start; padding-left: 10px }
.chrome .dots { width: 26px; height: 26px; display: grid; place-items: center; color: #3c4043; position: relative }
.chrome .dots svg { width: 18px; height: 18px }
.chrome + .shot { top: 74px }

/* sheets and dialogs */
.sheet { position: absolute; inset: auto 0 0; z-index: 5; background: #f2f2f7; border-radius: 16px 16px 0 0; padding: 10px 10px 18px; color: #111 }
.sheet .grab { width: 34px; height: 4px; border-radius: 3px; background: #c4c4c9; margin: 0 auto 10px }
.sheet .site { display: flex; gap: 8px; align-items: center; background: #fff; border-radius: 11px; padding: 7px 9px; font-size: 11px }
.sheet .site img { width: 28px; height: 28px; border-radius: 7px }
.sheet .site b { display: block; font-size: 11.5px }
.apps { display: flex; gap: 10px; padding: 10px 2px }
.apps i { width: 36px; height: 36px; border-radius: 10px; display: block; flex: none }
.rows { background: #fff; border-radius: 11px; overflow: hidden }
.row { display: flex; justify-content: space-between; align-items: center; padding: 8px 11px; font-size: 11.5px; border-top: 1px solid #ececf1; position: relative }
.row:first-child { border-top: 0 }
.row svg { width: 15px; height: 15px; color: #111 }
.row.hl { background: #fff0f5; font-weight: 700 }
.dialog { position: absolute; z-index: 5; inset: 30px 0 0; background: #f2f2f7; color: #111 }
.dbar { display: flex; justify-content: space-between; align-items: center; padding: 12px 12px 8px; font-size: 12px; position: relative }
.dbar b { font-size: 12.5px }
.dbar .blue { color: #0a84ff; font-weight: 600; position: relative }
.dcard { margin: 6px 10px; background: #fff; border-radius: 12px; padding: 10px; display: flex; gap: 10px; align-items: center; font-size: 12px }
.dcard img { width: 46px; height: 46px; border-radius: 11px }
.dcard .name { font-weight: 600; border-bottom: 1px solid #e3e3e8; padding-bottom: 5px; margin-bottom: 5px }
.dcard .addr { color: #8e8e93; font-size: 10.5px }
.toggle { margin: 8px 10px; background: #fff; border-radius: 12px; padding: 9px 10px; display: flex; justify-content: space-between; align-items: center; font-size: 11.5px }
.toggle i { width: 34px; height: 20px; border-radius: 10px; background: #34c759; position: relative }
.toggle i::after { content: ""; position: absolute; right: 2px; top: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff }
.menu { position: absolute; z-index: 5; top: 36px; right: 6px; width: 72%; background: #fff; border-radius: 6px; box-shadow: 0 6px 20px rgba(0,0,0,.28); padding: 4px 0; color: #202124 }
.menu .mi { padding: 7px 12px; font-size: 11.5px; position: relative; display: flex; align-items: center; gap: 9px }
.menu .mi svg { width: 15px; height: 15px; color: #5f6368 }
.menu .mi.hl { background: #fff0f5; font-weight: 700 }
.adlg { position: absolute; z-index: 5; left: 14px; right: 14px; top: 40%; background: #fff; border-radius: 20px; padding: 16px; color: #202124; font-size: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.35) }
.adlg h4 { margin: 0 0 10px; font: 600 15px 'Roboto', 'Inter', sans-serif }
.adlg .who { display: flex; gap: 10px; align-items: center }
.adlg .who img { width: 36px; height: 36px; border-radius: 50% }
.adlg .addr { color: #5f6368; font-size: 10.5px }
.adlg .btns { display: flex; justify-content: flex-end; gap: 16px; margin-top: 14px; font-weight: 600; color: #1a73e8 }
.adlg .btns span { position: relative; padding: 4px 6px }
.banner { position: absolute; z-index: 4; left: 0; right: 0; bottom: 0; background: #fff; border-radius: 14px 14px 0 0; padding: 12px; display: flex; gap: 10px; align-items: center; color: #202124; font-size: 11.5px; box-shadow: 0 -6px 20px rgba(0,0,0,.2) }
.banner img { width: 32px; height: 32px; border-radius: 8px }
.banner .go { margin-left: auto; background: #1a73e8; color: #fff; font-weight: 600; border-radius: 16px; padding: 6px 12px; position: relative }

/* home screen */
.home { position: absolute; inset: 0; background: linear-gradient(160deg, #3b3fb6 0%, #7b3fd0 50%, #d9457d 100%); }
.grid { position: absolute; top: 48px; left: 14px; right: 14px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px 10px }
.app { display: grid; justify-items: center; gap: 4px; font-size: 9.5px; color: #fff; text-align: center }
.app i { width: 44px; height: 44px; border-radius: 12px; display: block; background: rgba(255,255,255,.28) }
.app img { width: 44px; height: 44px; border-radius: 12px; display: block }
.phone.android .app i, .phone.android .app img { border-radius: 50% }
.app.tv { position: relative }
.dock { position: absolute; left: 12px; right: 12px; bottom: 14px; height: 62px; border-radius: 22px; background: rgba(255,255,255,.22) }
.phone.android .dock { background: transparent }

/* tap marker */
.tap::before { content: ""; position: absolute; left: 50%; top: 50%; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%; border: 3px solid var(--tap); box-shadow: 0 0 0 4px rgba(255,61,113,.25); z-index: 6; animation: ping 1.6s ease-out infinite; pointer-events: none }
.row.tap::before, .mi.tap::before { left: auto; right: 4px; margin: -20px 0 0 0 }
@keyframes ping { 0% { transform: scale(.7); opacity: 1 } 80%, 100% { transform: scale(1.35); opacity: 0 } }
@media (prefers-reduced-motion: reduce) { .tap::before { animation: none } }

/* after install + help */
.after { margin: 2.2rem 0 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 22px; min-width: 0 }
.box h2 { font-size: 1.3rem }
.box ul { margin: .8rem 0 0; padding-left: 1.1rem; color: var(--ink-soft); display: grid; gap: .5rem }
.box b { color: var(--ink) }
.share { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 1rem }
.link { font: 600 15px var(--font-body); background: var(--surface-2); border-radius: 12px; padding: 10px 14px; user-select: all; color: var(--ink) }
.copy { font: 700 15px var(--font-display); color: #fff; border: 0; border-radius: 12px; padding: 11px 16px; cursor: pointer; background: linear-gradient(100deg, #4f5fe6, #6d4be9 55%, #8a3fdc); min-height: 44px }
button:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px }
footer { color: var(--ink-mute); font-size: 13px; padding-block: 2.2rem 2.6rem }
</style>

<body>
<header class="hero">

const safariBar = (hl) => `<div class="safari"><div class="url">${ICONS.lock}${URL_TEXT}</div>
  <div class="tools"><span>${ICONS.back}</span><span>${ICONS.fwd}</span><span class="${hl ? 'tap' : ''}">${ICONS.share}</span><span>${ICONS.book}</span><span>${ICONS.tabs}</span></div></div>`
const chromeBar = (hl) => `<div class="chrome"><div class="url">${ICONS.lock}&nbsp;${URL_TEXT}</div><span class="dots ${hl ? 'tap' : ''}">${ICONS.dots}</span></div>`
// as on the phone: back · [≡ address ↻] · tabs
const safari26 = (hl) => `<div class="s26"><span class="s26b">${ICONS.back}</span><div class="s26u"><span class="s26m ${hl ? 'tap' : ''}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg></span><span class="s26a">${URL_TEXT}</span><span class="s26r"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></svg></span></div><span class="s26b">${ICONS.tabs}</span></div>`
const chromeIos = (hl) => `<div class="chrome cios"><div class="url">${ICONS.lock}&nbsp;${URL_TEXT}<span class="cshare ${hl ? 'tap' : ''}">${ICONS.share}</span></div></div><div class="cbar"><span>${ICONS.back}</span><span>${ICONS.fwd}</span><span>+</span><span>${ICONS.tabs}</span><span>•••</span></div>`
const shareSheet = (L, label) => `<div style="position:absolute;inset:0;background:rgba(0,0,0,.35);z-index:4"></div>
      <div class="sheet"><div class="grab"></div><div class="site"><img src="${IMG.icon}" alt=""><span><b>Truevento</b>${URL_TEXT}</span></div>
      <div class="apps"><i style="background:#5ac8fa"></i><i style="background:#34c759"></i><i style="background:#25d366"></i><i style="background:#ff9500"></i><i style="background:#af52de"></i></div>
      <div class="rows"><div class="row">${esc(L.copy)}${ICONS.copy}</div><div class="row">${esc(L.read)}${ICONS.book}</div><div class="row">${esc(L.fav)}${ICONS.star}</div>
      <div class="row hl tap">${esc(label)}${ICONS.plus}</div></div></div>`
const addDialog = (os, L) => phone(os, `<div class="dialog"><div class="dbar"><span class="blue" style="font-weight:400">${esc(L.cancel)}</span><b>${esc(L.addTitle)}</b><span class="blue tap">${esc(L.add)}</span></div>
      <div class="dcard"><img src="${IMG.icon}" alt=""><div style="flex:1;min-width:0"><div class="name">Truevento</div><div class="addr">https://${URL_TEXT}/</div></div></div>
      <div class="toggle"><span>${esc(L.webApp)}</span><i></i></div></div>`, true)
const homeScreen = (os, L) => {
  const apps = Array.from({ length: 11 }, () => '<div class="app"><i></i></div>').join('')
  return `<div class="home"></div><div class="grid">${apps}<div class="app tv tap"><img src="${IMG.icon}" alt=""><span>Truevento</span></div></div><div class="dock"></div>`
}

function mock(os, i, lang) {
  const L = T[lang].ui, w = IMG.welcome[lang], h = IMG.home[lang]
  const shot = (src, dim) => `<img class="shot" src="${src}" alt="">${dim ? '<div class="dim" style="position:absolute;inset:0"></div>' : ''}`
  if (os === 'ios' && iosV === 'ios26') {
    if (i === 0) return phone(os, shot(w) + safari26(false))
    if (i === 1) return phone(os, shot(w) + safari26(true))
    if (i === 2) return phone(os, shot(w) + safari26(false) + `<div style="position:absolute;inset:0;background:rgba(0,0,0,.35);z-index:4"></div><div class="pop"><div class="pi hl tap">${ICONS.share}${esc(T[lang].share)}</div><div class="pi">${ICONS.star}${esc(L.fav)}</div><div class="pi">${ICONS.book}${esc(L.read)}</div><div class="pi">${ICONS.tab}${esc(L.find)}</div></div>`)
    if (i === 3) return phone(os, shot(w) + shareSheet(L, L.addHome26))
    if (i === 4) return addDialog(os, L)
    return phone(os, homeScreen(os, L))
  }
  if (os === 'ios' && iosV === 'chrome') {
    if (i === 0) return phone(os, chromeIos(false) + shot(w), true)
    if (i === 1) return phone(os, chromeIos(true) + shot(w), true)
    if (i === 2) return phone(os, chromeIos(false) + shot(w) + shareSheet(L, L.addHome26), true)
    if (i === 3) return addDialog(os, L)
    return phone(os, homeScreen(os, L))
  }
  if (os === 'ios') {
    if (i === 0) return phone(os, shot(w) + safariBar(false))
    if (i === 1) return phone(os, shot(w) + safariBar(true))
    if (i === 2) return phone(os, shot(w) + `<div style="position:absolute;inset:0;background:rgba(0,0,0,.35);z-index:4"></div>
      <div class="sheet"><div class="grab"></div><div class="site"><img src="${IMG.icon}" alt=""><span><b>Truevento</b>${URL_TEXT}</span></div>
      <div class="apps"><i style="background:#5ac8fa"></i><i style="background:#34c759"></i><i style="background:#25d366"></i><i style="background:#ff9500"></i><i style="background:#af52de"></i></div>
      <div class="rows"><div class="row">${esc(L.copy)}${ICONS.copy}</div><div class="row">${esc(L.read)}${ICONS.book}</div><div class="row">${esc(L.fav)}${ICONS.star}</div>
      <div class="row hl tap">${esc(L.addHome)}${ICONS.plus}</div></div></div>`)
    if (i === 3) return phone(os, `<div class="dialog"><div class="dbar"><span class="blue" style="font-weight:400">${esc(L.cancel)}</span><b>${esc(L.addTitle)}</b><span class="blue tap">${esc(L.add)}</span></div>
      <div class="dcard"><img src="${IMG.icon}" alt=""><div style="flex:1;min-width:0"><div class="name">Truevento</div><div class="addr">https://${URL_TEXT}/</div></div></div>
      <div class="toggle"><span>${esc(L.webApp)}</span><i></i></div></div>`, true)
    return phone(os, homeScreen(os, L))
  }
  if (i === 0) return phone(os, chromeBar(false) + shot(w), true)
  if (i === 1) return phone(os, chromeBar(true) + shot(w), true)
  if (i === 2) return phone(os, chromeBar(false) + shot(w) + `<div class="menu"><div class="mi">${ICONS.tab}${esc(L.newTab)}</div><div class="mi">${ICONS.clock}${esc(L.history)}</div><div class="mi">${ICONS.dl}${esc(L.downloads)}</div><div class="mi">${ICONS.share}${esc(L.shareA)}</div><div class="mi hl tap">${ICONS.install}${esc(L.install)}</div></div>`, true)
  if (i === 3) return phone(os, chromeBar(false) + shot(w) + `<div style="position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:4"></div>
      <div class="adlg"><h4>${esc(L.installQ)}</h4><div class="who"><img src="${IMG.icon}" alt=""><div><b>Truevento</b><div class="addr">${URL_TEXT}</div></div></div>
      <div class="btns"><span>${esc(L.cancel)}</span><span class="tap">${esc(L.installBtn)}</span></div></div>`, true)
  return phone(os, homeScreen(os, L))
}

let lang = 'es', os = 'ios'
try { const n = (navigator.language || 'es').toLowerCase(); lang = n.startsWith('pt') ? 'pt' : n.startsWith('en') ? 'en' : 'es' } catch (e) {}
// opened from the app: the app's language
try { const a = localStorage.getItem('truevento-lang'); if (a === 'es' || a === 'pt' || a === 'en') lang = a } catch (e) {}
const ua = navigator.userAgent || ''
const isIOS = /iphone|ipad|ipod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)
const isAndroid = /android/i.test(ua)
os = isAndroid ? 'android' : 'ios'
// iPhone: Safari on iOS 26 (small bar with •••), Safari on iOS 18 or older, or Chrome ("CriOS")
const IN_APP = /Instagram|FBAN|FBAV|FB_IAB|Line\//.test(ua)
function detectIos() {
  if (/CriOS/.test(ua)) return 'chrome'
  const v = Number((ua.match(/Version\/(\d+)/) || [])[1] || 0)
  const osv = Number((ua.match(/OS (\d+)_/) || [])[1] || 0)
  if (v >= 26 || osv >= 26) return 'ios26'
  return v || osv ? 'ios18' : 'ios26'
}
const detectedV = isIOS ? detectIos() : null
let iosV = detectedV || 'ios26'
try { const s = JSON.parse(localStorage.getItem('tv-install-tutorial') || '{}'); if (s.lang) lang = s.lang; if (s.os) os = s.os; if (s.iosV) iosV = s.iosV } catch (e) {}

function render() {
  const t = T[lang]
  document.documentElement.lang = lang
  document.querySelectorAll('[data-t]').forEach((el) => {
    const k = el.dataset.t
    if (k === 'detected') return
    if (typeof t[k] === 'string') el.innerHTML = t[k]
  })
  document.getElementById('detected').textContent = t.detected[isIOS ? 'ios' : isAndroid ? 'android' : 'other']
  document.querySelectorAll('.langs button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)))
  document.querySelectorAll('.switch button').forEach((b) => { b.setAttribute('aria-selected', String(b.dataset.os === os)); b.tabIndex = b.dataset.os === os ? 0 : -1 })
  document.getElementById('steps').setAttribute('aria-labelledby', 'tab-' + os)
  const fill = (s) => s.replace('{url}', URL_TEXT).replace('{shareIcon}', ICONS.share).replace('{plusIcon}', ICONS.plus).replace('{dotsIcon}', ICONS.dots).replace('{installIcon}', ICONS.install)
  const box = document.getElementById('variants')
  if (os === 'ios') {
    const p = t.pick, MINI = { ios26: '<span class="mini m26"><i class="b"></i><i class="u">≡</i><i class="d"></i></span>', ios18: '<span class="mini m18"><i class="u"></i><span class="r"><i></i><i></i><i class="s"></i><i></i><i></i></span></span>', chrome: '<span class="mini mch"><i class="u"><i class="s"></i></i></span>' }
    box.innerHTML = `<p class="vt">${esc(p.title)}</p>${IN_APP ? `<p class="inapp">${esc(p.inApp)}</p>` : ''}
      <div class="vars" role="radiogroup" aria-label="${esc(p.title)}">${['ios26', 'ios18', 'chrome'].map((v) => `<button type="button" role="radio" aria-checked="${v === iosV}" data-v="${v}" class="var">${MINI[v]}<b>${esc(p[v][0])}</b><small>${esc(p[v][1])}</small>${v === detectedV ? `<em>${esc(p.detected)}</em>` : ''}</button>`).join('')}</div>
      <p class="vh">${esc(p.hint)}</p>`
    box.querySelectorAll('[data-v]').forEach((b) => b.addEventListener('click', () => { iosV = b.dataset.v; render() }))
  } else box.innerHTML = ''
  const list = os === 'ios' ? t[iosV === 'ios18' ? 'ios18' : iosV === 'ios26' ? 'ios26' : 'iosChrome'] : t[os]
  document.getElementById('steps').innerHTML = list.map(([title, body, tip], i) => `
    <li class="step"><div class="step-text"><span class="num" aria-label="${t.step} ${i + 1}">${i + 1}</span>
      <h3>${esc(title)}</h3><p>${fill(body)}</p>${tip ? `<p class="tip">${fill(tip)}</p>` : ''}</div>
      ${mock(os, i, lang).replace('role="img"', `role="img" aria-label="${esc(t.step + ' ' + (i + 1) + ': ' + title)}"`)}</li>`).join('')
  document.getElementById('help').innerHTML = t.help[os].map((x) => `<li>${x}</li>`).join('')
  try { localStorage.setItem('tv-install-tutorial', JSON.stringify({ lang, os, iosV })) } catch (e) {}
}
document.querySelectorAll('.langs button').forEach((b) => b.addEventListener('click', () => { lang = b.dataset.lang; render() }))
document.querySelectorAll('.switch button').forEach((b) => b.addEventListener('click', () => { os = b.dataset.os; render() }))
document.querySelector('.switch').addEventListener('keydown', (e) => {
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return
  os = os === 'ios' ? 'android' : 'ios'; render(); document.getElementById('tab-' + os).focus()
})
document.getElementById('copy').addEventListener('click', async () => {
  const btn = document.getElementById('copy')
  try { await navigator.clipboard.writeText('https://' + URL_TEXT); btn.textContent = T[lang].copied }
  catch (e) { const r = document.createRange(); r.selectNodeContents(document.getElementById('applink')); const s = getSelection(); s.removeAllRanges(); s.addRange(r) }
  setTimeout(() => { btn.textContent = T[lang].copy }, 2200)
})
render()
// one tap on Android: the browser's own install window
let deferredInstall = null
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault()
  deferredInstall = e
  document.getElementById('onetap').classList.add('show')
})
window.addEventListener('appinstalled', () => document.getElementById('onetap').classList.remove('show'))
document.getElementById('onetap-btn').addEventListener('click', async () => {
  if (!deferredInstall) return
  deferredInstall.prompt()
  await deferredInstall.userChoice
  deferredInstall = null
  document.getElementById('onetap').classList.remove('show')
})
</script>

</body>
</html>
