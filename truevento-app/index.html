<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>TRUEVENTO</title>
    <meta name="description" content="Gestión de clases, alumnos, instructores y liquidaciones de TRUEVENTO Kiteschool." />
    <meta name="theme-color" content="#0b2545" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="TRUEVENTO" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="/icons/favicon-64.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/outfit-latin.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      /* launch screen, shown until the app is ready */
      #splash {
        position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 22px; background: radial-gradient(120% 80% at 50% 0%, #14406e, #061a2e 70%);
        color: #fff; transition: opacity .35s ease;
      }
      #splash.hide { opacity: 0; pointer-events: none; }
      #splash img { width: 112px; height: 112px; border-radius: 26px; box-shadow: 0 0 60px rgba(14,165,233,.45); }
      #splash .name { font: 800 30px/1 'Outfit', system-ui, sans-serif; letter-spacing: .14em; }
      #splash .sub { font: 600 12px/1 system-ui, sans-serif; letter-spacing: .5em; color: #38bdf8; margin-top: -12px; }
      #splash .bar { width: 120px; height: 3px; border-radius: 3px; background: rgba(255,255,255,.12); overflow: hidden; }
      #splash .bar::after { content: ''; display: block; width: 40%; height: 100%; border-radius: 3px;
        background: linear-gradient(90deg, #0ea5e9, #f472b6); animation: slide 1.1s ease-in-out infinite; }
      @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Cargando TRUEVENTO">
      <img src="/icons/icon-192.png" alt="" />
      <div class="name">TRUEVENTO</div>
      <div class="sub">KITESCHOOL</div>
      <div class="bar"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
